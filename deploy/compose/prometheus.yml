global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: control-plane
    static_configs:
      - targets: ["control-plane:7400"]

# To be notified, add an Alertmanager here and point it at email, chat or a pager.
