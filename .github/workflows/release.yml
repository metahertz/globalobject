# On a version tag (v0.2.0, say): build binaries for Linux and macOS, publish them with
# checksums and the install scripts as a GitHub release, and push the control-plane image to
# GitHub's container registry. install.sh downloads from these releases.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # A tag that doesn't match the crate version would ship binaries reporting the wrong version.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$crate" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $crate"; exit 1; }

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest, zig: false }
          - { target: aarch64-apple-darwin, os: macos-latest, zig: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The control plane serves install.sh, so it needs to know where releases live.
      - name: Point install.sh at this repository
        run: sed -i.bak "s|^DEFAULT_REPO=\"\"|DEFAULT_REPO=\"$GITHUB_REPOSITORY\"|" install.sh && rm install.sh.bak
      - run: rustup target add ${{ matrix.target }}
      - name: Install cargo-zigbuild (static Linux builds)
        if: matrix.zig
        run: pip3 install ziglang && cargo install cargo-zigbuild --locked
      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = true ]; then build="cargo zigbuild"; else build="cargo build"; fi
          $build --profile dist --locked --target ${{ matrix.target }} -p globalobject-client -p globalobject-node -p globalobject-control-plane
      - name: Package
        run: |
          out=target/${{ matrix.target }}/dist
          mkdir dist
          tar -czf dist/globalobject-${{ matrix.target }}.tar.gz -C "$out" globalobject globalobject-node
          tar -czf dist/globalobject-control-plane-${{ matrix.target }}.tar.gz -C "$out" globalobject-control-plane
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and install scripts
        run: |
          # Point both scripts at this repository; the server script also pins this release's image.
          sed -i "s|^DEFAULT_REPO=\"\"|DEFAULT_REPO=\"$GITHUB_REPOSITORY\"|" install.sh deploy/install-server.sh
          sed -i "s|^DEFAULT_VERSION=\"\"|DEFAULT_VERSION=\"$GITHUB_REF_NAME\"|" deploy/install-server.sh
          cp install.sh deploy/install-server.sh dist/
          cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  # The image reuses the release's static Linux binaries, so it runs exactly what the release ships,
  # and needs no Rust build of its own.
  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Lay out binaries per architecture
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair#*:}-unknown-linux-musl
            mkdir -p image/bin/$arch
            for f in dist/globalobject-$target.tar.gz dist/globalobject-control-plane-$target.tar.gz; do
              tar -xzf "$f" -C image/bin/$arch
            done
          done
          ls -l image/bin/*
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-control-plane" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          file: deploy/compose/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          # The source label links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.description=GlobalObject control plane
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT OR Apache-2.0
            index:org.opencontainers.image.description=GlobalObject control plane
