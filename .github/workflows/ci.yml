name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      # Transactions need a replica set. Service containers can't pass `--replSet`, so start it here.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in $(seq 30); do
            docker exec mongo mongosh --quiet --eval \
              'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}).ok }' && break
            sleep 2
          done
          until docker exec mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done
      - run: cargo fmt --all --check
      - name: Shell scripts
        run: shellcheck install.sh deploy/install-server.sh scripts/test.sh scripts/grid.sh
      - run: python3 scripts/check-licences.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/test.sh
